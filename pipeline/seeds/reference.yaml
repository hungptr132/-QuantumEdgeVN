# Reference data: exchanges, sectors, companies, tickers, reviewers.
#
# `description_vi` is deliberately absent from every company. The schema reserves that
# prose for a person (see models.Company), so it is left NULL here and will surface as a
# disclosure gap on the ticker page until a human writes it. That is the honest state,
# not an oversight.

exchanges:
  - code: HOSE
    name: Ho Chi Minh Stock Exchange
  - code: HNX
    name: Hanoi Stock Exchange
  - code: UPCOM
    name: Unlisted Public Company Market

# Three sectors, three tickers each. A "sector median" of one or two peers is not a
# median, so min_benchmark_sample is 3 and the coverage set is built to satisfy it.
sectors:
  - code: steel
    name_vi: Thép
    name_en: Steel
  - code: auto_retail
    name_vi: Ô tô và phân phối ô tô
    name_en: Automotive and dealerships
  - code: food_agri
    name_vi: Thủy sản và nông sản
    name_en: Aquaculture and agriculture

# Legal names are facts and are seeded. Business descriptions are editorial and are not.
companies:
  - short_name: SMC
    legal_name_vi: Công ty Cổ phần Đầu tư Thương mại SMC
    sector: steel
    ticker: { symbol: SMC, exchange: HOSE }
  - short_name: Nam Kim
    legal_name_vi: Công ty Cổ phần Thép Nam Kim
    sector: steel
    ticker: { symbol: NKG, exchange: HOSE }
  - short_name: Pomina
    legal_name_vi: Công ty Cổ phần Thép Pomina
    sector: steel
    ticker: { symbol: POM, exchange: HOSE }

  - short_name: Hàng Xanh
    legal_name_vi: Công ty Cổ phần Dịch vụ Ô tô Hàng Xanh
    sector: auto_retail
    ticker: { symbol: HAX, exchange: HOSE }
  - short_name: City Auto
    legal_name_vi: Công ty Cổ phần City Auto
    sector: auto_retail
    ticker: { symbol: CTF, exchange: HOSE }
  - short_name: TMT Motors
    legal_name_vi: Công ty Cổ phần Ô tô TMT
    sector: auto_retail
    ticker: { symbol: TMT, exchange: HOSE }

  - short_name: Nam Việt
    legal_name_vi: Công ty Cổ phần Nam Việt
    sector: food_agri
    ticker: { symbol: ANV, exchange: HOSE }
  - short_name: Vĩnh Hoàn
    legal_name_vi: Công ty Cổ phần Vĩnh Hoàn
    sector: food_agri
    ticker: { symbol: VHC, exchange: HOSE }
  - short_name: Angimex
    legal_name_vi: Công ty Cổ phần Xuất nhập khẩu An Giang
    sector: food_agri
    ticker: { symbol: AGM, exchange: HOSE }

# Data sources. One row per provider; `robots_note` records the access basis we verified,
# so the justification travels with the code rather than living in someone's memory.
sources:
  - code: vndirect_dchart
    kind: market_data
    name: VNDirect dchart (daily OHLCV)
    base_url: https://dchart-api.vndirect.com.vn/dchart/history
    rate_limit_per_min: 20
    robots_note: >-
      Public endpoint, no credentials, no challenge. Verified returning real daily bars
      for all 9 covered tickers on 2026-10-01. Prices arrive in thousands of VND and are
      scaled during extraction, not here.
  - code: hose_disclosure
    kind: disclosure
    name: HOSE disclosures and statement attachments
    base_url: https://www.hsx.vn
    rate_limit_per_min: 10
    robots_note: >-
      hsx.vn/robots.txt is "User-agent: * / Disallow:" - an empty Disallow, i.e. full
      crawl permission explicitly granted. Site is a client-side SPA; backend endpoints
      must be discovered by observing real traffic (milestone M8), never guessed.
  - code: hose_search
    kind: market_data
    name: HOSE public securities search (symbol -> internal id)
    base_url: https://api.hsx.vn/q/api/v1/search
    rate_limit_per_min: 20
    robots_note: >-
      The endpoint the hsx.vn search box itself calls when a visitor types a ticker.
      Path and parameters were read from the bundle the site serves to every visitor,
      not guessed. Verified resolving all 9 covered tickers on 2026-10-03, each
      returning the exchange's internal numeric id plus ISIN and FIGI. This is the join
      key every other HOSE endpoint requires.
  - code: company_filing
    kind: manual
    name: Company filings placed in pipeline/data/filings
    base_url: null
    rate_limit_per_min: 60
    robots_note: >-
      Not fetched. Files are downloaded by a person from the company's IR page or HOSE and
      placed on disk, then hashed and stored immutably. This is the most authoritative
      fundamentals input available - the company's own filed statement rather than a third
      party's rendering - and it needs no API, so it is unaffected by HOSE's statements
      endpoint being gated.

# The reviewer whose name goes on every published page. The stamp is the product, so this
# must be a real person with a real foreign key, not a free-text string.
users:
  - slug: richard
    display_name: Richard
    role: reviewer

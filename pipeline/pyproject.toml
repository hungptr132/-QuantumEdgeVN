[project]
name = "quantumedge-pipeline"
version = "0.1.0"
description = "Deterministic data pipeline for QuantumEdge - Vietnamese stock verification"
requires-python = ">=3.12,<3.13"

# NOTE: vnstock is deliberately absent. Its PyPI distribution (vnstock3) depends on
# `vnai`, which is not published on PyPI and has no public repo, so it cannot be
# installed. Market data comes from sources verified reachable in docs/DECISIONS.md.
dependencies = [
    # database
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    # contracts & config
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # cli & logging
    "typer>=0.15",
    "rich>=13",
    "structlog>=24",
    # fetching
    "httpx>=0.28",
    "tenacity>=9.0",
    "feedparser>=6.0",
    # parsing
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    # data
    "pandas>=2.2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[project.scripts]
qe = "quantumedge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantumedge"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Migration bodies are generated DDL. Reformatting them risks changing semantics for no
# benefit, and their long column definitions are inherent. env.py IS linted.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[project]
name = "quantumedge-pipeline"
version = "0.1.0"
description = "Deterministic data pipeline for QuantumEdge - Vietnamese stock verification"
requires-python = ">=3.12,<3.13"

# NOTE: vnstock is deliberately absent. Its PyPI distribution (vnstock3) depends on
# `vnai`, which is not published on PyPI and has no public repo, so it cannot be
# installed. Market data comes from sources verified reachable in docs/DECISIONS.md.
dependencies = [
    # database
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    # contracts & config
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # cli & logging
    "typer>=0.15",
    "rich>=13",
    "structlog>=24",
    # fetching
    "httpx>=0.28",
    "tenacity>=9.0",
    "feedparser>=6.0",
    # parsing
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    # data
    "pandas>=2.2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    "types-openpyxl>=3.1",
]

[project.scripts]
qe = "quantumedge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantumedge"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
# Migration bodies are generated DDL. Reformatting them risks changing semantics for no
# benefit, and their long column definitions are inherent.
exclude = ["migrations/versions/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# Migrations are *linted* even though they are not formatted. They used to be excluded
# from both, and that is how `import sqlalchemy as sa` became `as s` in revision
# 5c77d43f28ec and shipped: every `sa.Column` in the body was an undefined name, the
# suite stayed green because the test database already had the revision applied, and the
# failure only appeared on a cold start - the one path a recovery depends on. F821 catches
# it in a second. Only the stylistic rules that generated DDL inherently trips are waived.
[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501", "I001", "E402"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true

# pdfplumber ships no type information and has no stub package. The alternative to
# this override is an inline `type: ignore` at each import, which hides the same
# untypedness in more places. openpyxl is NOT listed here - types-openpyxl exists and
# is a dev dependency, so spreadsheet reading is genuinely checked.
[[tool.mypy.overrides]]
module = ["pdfplumber", "pdfplumber.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

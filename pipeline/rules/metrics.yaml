# Metric definitions. `definition_vi` is the glossary text the ticker page links to —
# the spec's real financial-literacy component, and it is cheap to carry here.
#
# `is_headline: true` marks the five metrics the page leads with.
# `requires_facts` declares inputs so a metric can report WHICH input was missing rather
# than just failing.

metrics:
  # ---------- market / liquidity (Agent 5, pure code, no statements needed) ----------
  - code: close_price
    label_vi: Giá đóng cửa
    label_en: Closing price
    unit: VND
    category: price
    formula_text: close of the most recent trading session
    definition_vi: >-
      Giá khớp lệnh cuối cùng của phiên giao dịch gần nhất.
    precision: 0

  - code: price_to_par
    label_vi: Giá so với mệnh giá
    label_en: Price to par value
    unit: ratio
    category: valuation
    formula_text: close / par_value
    is_headline: true
    definition_vi: >-
      Giá thị trường chia cho mệnh giá (thường là 10.000 đồng). Dưới 1 nghĩa là thị
      trường đang định giá mỗi cổ phiếu thấp hơn mệnh giá ghi trên sổ sách — không tự
      động là xấu, nhưng là điều cần giải thích.
    precision: 2

  - code: avg_volume_20s
    label_vi: Khối lượng bình quân 20 phiên
    label_en: 20-session average volume
    unit: share
    category: liquidity_market
    formula_text: mean(volume) over the last 20 trading sessions
    definition_vi: >-
      Số cổ phiếu được giao dịch bình quân mỗi phiên, tính trên 20 phiên giao dịch gần
      nhất theo lịch giao dịch thực tế (không phải 20 dòng dữ liệu).
    precision: 0

  - code: avg_turnover_20s_vnd
    label_vi: Giá trị giao dịch bình quân 20 phiên
    label_en: 20-session average turnover
    unit: VND
    category: liquidity_market
    formula_text: mean(close * volume) over the last 20 trading sessions
    is_headline: true
    definition_vi: >-
      Giá trị tiền thực sự đổi chủ mỗi phiên. Đây là thước đo thanh khoản quan trọng hơn
      khối lượng, vì nó cho biết bạn có thể mua hoặc bán bao nhiêu tiền mà không tự đẩy
      giá.
    precision: 0

  - code: median_turnover_20s_vnd
    label_vi: Giá trị giao dịch trung vị 20 phiên
    label_en: 20-session median turnover
    unit: VND
    category: liquidity_market
    formula_text: median(close * volume) over the last 20 trading sessions
    is_headline: true
    definition_vi: >-
      Giá trị giao dịch của một phiên TIÊU BIỂU. Khác với giá trị bình quân, chỉ số này
      không bị một vài phiên giao dịch khối lượng lớn làm méo. Nếu trung vị bằng 0 trong
      khi bình quân rất cao, nghĩa là cổ phiếu hầu như không giao dịch mà chỉ thỉnh thoảng
      được chuyển nhượng theo lô — hai việc hoàn toàn khác nhau đối với người cần bán.
    precision: 0

  - code: zero_trade_sessions_3m
    label_vi: Số phiên không có giao dịch (3 tháng)
    label_en: Zero-trade sessions (3 months)
    unit: session
    category: liquidity_market
    formula_text: count of trading-calendar sessions in the last 63 where volume = 0
    definition_vi: >-
      Số phiên mà thị trường mở nhưng không có một cổ phiếu nào được khớp. Phân biệt rõ
      với phiên thiếu dữ liệu: đây là phiên có thật và không ai giao dịch.
    precision: 0

  - code: zero_trade_ratio_3m
    label_vi: Tỷ lệ phiên không giao dịch (3 tháng)
    label_en: Zero-trade session ratio (3 months)
    unit: pct
    category: liquidity_market
    formula_text: zero_trade_sessions_3m / trading_sessions_3m
    is_headline: true
    definition_vi: >-
      Tỷ lệ phiên không có giao dịch nào. Tỷ lệ cao nghĩa là cổ phiếu gần như đóng băng:
      khi cần bán, có thể không có người mua ở bất kỳ giá nào.
    precision: 4

  - code: missing_bar_sessions_3m
    label_vi: Số phiên thiếu dữ liệu (3 tháng)
    label_en: Missing bars (3 months)
    unit: session
    category: liquidity_market
    formula_text: trading-calendar sessions in the last 63 with no price bar at all
    definition_vi: >-
      Số phiên mà lịch giao dịch có nhưng dữ liệu giá bị thiếu. Chỉ số này tồn tại để
      không nhầm lẫn giữa "không ai giao dịch" và "chúng tôi không có dữ liệu".
    precision: 0

  - code: price_range_52w_pct
    label_vi: Biên độ giá 52 tuần
    label_en: 52-week price range
    unit: pct
    category: price
    formula_text: (high_52w - low_52w) / low_52w
    definition_vi: >-
      Khoảng cách giữa giá cao nhất và thấp nhất trong 52 tuần, tính theo phần trăm so
      với giá thấp nhất. Biên độ rất rộng ở một cổ phiếu thanh khoản mỏng thường phản
      ánh việc thiếu người giao dịch hơn là thay đổi giá trị doanh nghiệp.
    precision: 4

  - code: pct_from_52w_high
    label_vi: Cách đỉnh 52 tuần
    label_en: Below 52-week high
    unit: pct
    category: price
    formula_text: (close - high_52w) / high_52w
    definition_vi: >-
      Giá hiện tại thấp hơn đỉnh 52 tuần bao nhiêu phần trăm.
    precision: 4

  - code: turnover_concentration_3m
    label_vi: Mức độ tập trung giao dịch (3 tháng)
    label_en: Turnover concentration (3 months)
    # A share of turnover, so it reads as a percentage - same as zero_trade_ratio_3m.
    # "52,21%" is a figure a reader acts on; "0,5221" is one they have to convert first.
    unit: pct
    category: liquidity_market
    formula_text: turnover of 3 heaviest sessions / total turnover over 63 sessions
    definition_vi: >-
      Tỷ lệ giá trị giao dịch của ba phiên lớn nhất so với tổng giá trị giao dịch trong ba
      tháng. Tỷ lệ cao có nghĩa thanh khoản chỉ xuất hiện vào vài phiên riêng lẻ - thường
      là các giao dịch lô lớn - chứ không đều đặn. Khi đó, con số giao dịch bình quân
      không phản ánh khả năng bán ra trong một phiên thông thường.
    precision: 4
    is_headline: true

  - code: max_drawdown_52w
    label_vi: Mức sụt giảm sâu nhất (52 tuần)
    label_en: Maximum drawdown (52 weeks)
    unit: pct
    category: price
    formula_text: min over window of (close - running_peak) / running_peak
    definition_vi: >-
      Mức giảm sâu nhất từ một đỉnh xuống đáy tiếp theo trong 52 tuần. Khác với "cách đỉnh
      52 tuần", chỉ số này đo cả đoạn đường đã đi qua, không chỉ khoảng cách tới hiện tại.
    precision: 4

  - code: sessions_since_52w_high
    label_vi: Số phiên kể từ đỉnh 52 tuần
    label_en: Sessions since the 52-week high
    unit: session
    category: price
    formula_text: count of trading sessions between the 52w high and as_of
    definition_vi: >-
      Số phiên giao dịch đã trôi qua kể từ phiên có giá đóng cửa cao nhất trong 52 tuần.
      Một mã thấp hơn đỉnh 40% từ tháng trước và một mã thấp hơn đỉnh 40% từ một năm trước
      là hai trạng thái khác nhau.
    precision: 0

  - code: bid_ask_spread_pct
    label_vi: Chênh lệch mua - bán
    label_en: Bid-ask spread
    unit: pct
    category: liquidity_market
    formula_text: (best_ask - best_bid) / midpoint
    definition_vi: >-
      Khoảng cách giữa giá chào mua cao nhất và giá chào bán thấp nhất. Chênh lệch rộng
      là một loại chi phí ẩn: bạn mất phần đó ngay khi vừa mua xong.
    precision: 4

  - code: sessions_to_exit
    label_vi: Số phiên cần để thoát vị thế
    label_en: Sessions to exit
    unit: session
    category: liquidity_market
    formula_text: position_vnd / (avg_turnover_20s_vnd * participation_rate)
    definition_vi: >-
      Ước tính số phiên giao dịch cần thiết để bán hết một vị thế, với giả định bạn
      không chiếm quá một tỷ lệ nhất định của giá trị giao dịch mỗi phiên (tỷ lệ này
      luôn được ghi rõ kèm kết quả). Đây là thước đo RỦI RO, không phải tín hiệu mua bán.
    precision: 1

  # ---------- fundamentals (require statements; Arc B) ----------
  - code: pe
    label_vi: P/E
    label_en: Price to earnings
    unit: x
    category: valuation
    formula_text: market_cap / net_profit_after_tax_ttm
    requires_facts: [net_profit_after_tax, shares_outstanding]
    is_headline: true
    definition_vi: >-
      Giá cổ phiếu chia cho lợi nhuận trên mỗi cổ phiếu. Khi doanh nghiệp lỗ, chỉ số này
      không có ý nghĩa và sẽ được ghi là không công bố thay vì hiển thị một số âm.
    precision: 2

  - code: pb
    label_vi: P/B
    label_en: Price to book
    unit: x
    category: valuation
    formula_text: market_cap / total_equity
    requires_facts: [total_equity, shares_outstanding]
    definition_vi: >-
      Giá thị trường của toàn bộ cổ phiếu chia cho vốn chủ sở hữu ghi trên sổ sách. Dưới
      1 lần nghĩa là thị trường đang trả ít hơn phần giá trị sổ sách thuộc về cổ đông.
      Điều đó không tự động là rẻ: giá trị sổ sách chỉ đáng tin khi tài sản trên sổ phản
      ánh đúng số tiền có thể thu hồi. Khi vốn chủ sở hữu âm, chỉ số không có ý nghĩa và
      được ghi là không công bố thay vì hiển thị một số âm.
    precision: 2

  - code: eps
    label_vi: EPS - Lợi nhuận trên mỗi cổ phiếu
    label_en: Earnings per share
    unit: VND
    category: profitability
    formula_text: net_profit_after_tax_ttm / shares_outstanding
    requires_facts: [net_profit_after_tax, shares_outstanding]
    definition_vi: >-
      Lợi nhuận sau thuế của bốn quý gần nhất chia cho số cổ phiếu đang lưu hành: phần
      lợi nhuận tính trên mỗi cổ phiếu. Khi doanh nghiệp lỗ, chỉ số này âm và vẫn được
      hiển thị, vì một khoản lỗ trên mỗi cổ phiếu là thông tin đọc đúng nghĩa ngay. Đây
      là chỗ khác với P/E âm, vốn dễ bị đọc thành "chỉ số thấp nên rẻ".
    precision: 0

  - code: book_value_per_share
    label_vi: Giá trị sổ sách trên mỗi cổ phiếu
    label_en: Book value per share
    unit: VND
    category: valuation
    formula_text: total_equity / shares_outstanding
    requires_facts: [total_equity, shares_outstanding]
    definition_vi: >-
      Vốn chủ sở hữu tại cuối quý gần nhất chia cho số cổ phiếu đang lưu hành, tức phần
      tài sản ròng theo sổ sách tương ứng với mỗi cổ phiếu. Nếu con số này thấp hơn mệnh
      giá, phần lớn vốn cổ đông đã góp đã bị lỗ lũy kế ăn mòn. Nếu nó âm, nợ phải trả đã
      vượt tổng tài sản trên sổ sách.
    precision: 0

  - code: ev_ebitda
    label_vi: EV/EBITDA
    unit: x
    category: valuation
    formula_text: (market_cap + net_debt) / ebitda_ttm
    requires_facts: [profit_before_tax, interest_expense, depreciation_amortisation,
                     short_term_debt, long_term_debt, cash_and_equivalents]
    definition_vi: >-
      Giá trị toàn doanh nghiệp (gồm cả nợ) so với lợi nhuận trước lãi vay, thuế và khấu
      hao. Hữu ích khi so sánh các doanh nghiệp có mức nợ khác nhau.
    precision: 2

  - code: interest_coverage
    label_vi: Khả năng trả lãi
    label_en: Interest coverage
    unit: x
    category: leverage
    formula_text: ebit_ttm / interest_expense_ttm
    requires_facts: [profit_before_tax, interest_expense]
    is_headline: true
    definition_vi: >-
      Lợi nhuận trước lãi vay và thuế chia cho chi phí lãi vay. Dưới 2 lần nghĩa là
      doanh nghiệp phụ thuộc vào việc tiếp tục vay được để trả lãi khoản vay hiện tại.
    precision: 2

  - code: net_debt_ebitda
    label_vi: Nợ ròng / EBITDA
    unit: x
    category: leverage
    formula_text: (short_term_debt + long_term_debt - cash_and_equivalents) / ebitda_ttm
    requires_facts: [short_term_debt, long_term_debt, cash_and_equivalents,
                     profit_before_tax, interest_expense, depreciation_amortisation]
    definition_vi: >-
      Số năm lợi nhuận cần có để trả hết nợ ròng. Càng cao thì doanh nghiệp càng ít chịu
      được một năm kinh doanh xấu.
    precision: 2

  - code: debt_to_equity
    label_vi: Nợ vay / Vốn chủ sở hữu
    label_en: Debt to equity
    unit: x
    category: leverage
    formula_text: (short_term_debt + long_term_debt) / total_equity
    requires_facts: [short_term_debt, long_term_debt, total_equity]
    definition_vi: >-
      Tổng nợ vay ngắn hạn và dài hạn so với vốn chủ sở hữu. Chỉ tính các khoản vay có
      lãi, không tính toàn bộ nợ phải trả, nên con số này thấp hơn tỷ lệ nợ trên tổng tài
      sản và đo đúng phần nợ phải trả lãi định kỳ. Khi vốn chủ sở hữu âm, chỉ số không có
      ý nghĩa và được ghi là không công bố.
    precision: 2

  - code: roe
    label_vi: ROE
    label_en: Return on equity
    unit: pct
    category: profitability
    formula_text: net_profit_after_tax_ttm / total_equity
    requires_facts: [net_profit_after_tax, total_equity]
    definition_vi: >-
      Lợi nhuận bốn quý gần nhất tạo ra trên mỗi đồng vốn chủ sở hữu tại cuối kỳ. Vốn vay
      có thể làm chỉ số này cao lên mà không đi kèm hiệu quả kinh doanh tốt hơn, nên nó
      đáng được đọc cùng với ROA và tỷ lệ nợ vay.
    precision: 4

  - code: roa
    label_vi: ROA
    label_en: Return on assets
    unit: pct
    category: profitability
    formula_text: net_profit_after_tax_ttm / total_assets
    requires_facts: [net_profit_after_tax, total_assets]
    definition_vi: >-
      Lợi nhuận bốn quý gần nhất so với tổng tài sản. Khác với ROE, chỉ số này không được
      vốn vay làm đẹp: hai doanh nghiệp có ROE bằng nhau nhưng ROA chênh lệch lớn thì
      doanh nghiệp có ROA thấp đang dựa nhiều hơn vào nợ để tạo ra cùng mức sinh lời cho
      cổ đông.
    precision: 4

  - code: net_margin
    label_vi: Tỷ suất lợi nhuận ròng
    label_en: Net profit margin
    unit: pct
    category: profitability
    formula_text: net_profit_after_tax_ttm / revenue_ttm
    requires_facts: [net_profit_after_tax, revenue]
    definition_vi: >-
      Phần còn lại của mỗi đồng doanh thu sau khi trừ toàn bộ chi phí, lãi vay và thuế,
      tính trên bốn quý gần nhất. Tỷ suất rất mỏng nghĩa là lợi nhuận có thể chuyển thành
      lỗ chỉ vì một thay đổi nhỏ của giá vốn hoặc chi phí lãi vay.
    precision: 4

  - code: gross_margin
    label_vi: Tỷ suất lợi nhuận gộp
    label_en: Gross profit margin
    unit: pct
    category: profitability
    formula_text: gross_profit_ttm / revenue_ttm
    requires_facts: [gross_profit, revenue]
    definition_vi: >-
      Phần còn lại của mỗi đồng doanh thu sau khi trừ giá vốn hàng bán, tính trên bốn quý
      gần nhất. Tỷ suất gộp cho thấy doanh nghiệp có bao nhiêu quyền định giá trước khi
      tính đến chi phí quản lý và lãi vay. Nó thường ổn định trong một ngành, nên một thay
      đổi lớn giữa các năm là điều cần tìm nguyên nhân trong thuyết minh.
    precision: 4

  - code: cfo_to_net_profit
    label_vi: Dòng tiền kinh doanh / Lợi nhuận sau thuế
    label_en: Cash flow from operations to net profit
    unit: x
    category: profitability
    formula_text: cfo_ttm / net_profit_after_tax_ttm
    requires_facts: [cfo, net_profit_after_tax]
    definition_vi: >-
      Tiền thực thu từ hoạt động kinh doanh so với lợi nhuận sau thuế, trên cùng bốn quý.
      Quanh mức 1 lần nghĩa là lợi nhuận ghi trên báo cáo đã thực sự về thành tiền. Thấp
      hơn nhiều, hoặc âm, nghĩa là lợi nhuận đang nằm ở khoản phải thu và hàng tồn kho
      chứ chưa thu được tiền. Chỉ số chỉ được tính khi lợi nhuận dương, vì tỷ lệ so với
      một khoản lỗ không có cách đọc.
    precision: 2

  - code: revenue_growth_yoy
    label_vi: Tăng trưởng doanh thu (so với cùng kỳ)
    label_en: Revenue growth, year on year
    unit: pct
    category: growth
    formula_text: revenue_ttm / revenue_ttm_prior_year - 1
    requires_facts: [revenue]
    definition_vi: >-
      Doanh thu bốn quý gần nhất so với bốn quý cùng kỳ năm trước. So sánh hai kỳ mười
      hai tháng nên yếu tố mùa vụ đã được loại bỏ, khác với việc so hai quý liền kề. Phép
      so sánh này cần đủ tám quý liên tiếp; thiếu một quý thì chỉ số được ghi là không
      công bố kèm tên quý còn thiếu, chứ không ước lượng bù.
    precision: 4

  - code: net_profit_growth_yoy
    label_vi: Tăng trưởng lợi nhuận sau thuế (so với cùng kỳ)
    label_en: Net profit growth, year on year
    unit: pct
    category: growth
    formula_text: net_profit_after_tax_ttm / net_profit_after_tax_ttm_prior_year - 1
    requires_facts: [net_profit_after_tax]
    definition_vi: >-
      Lợi nhuận sau thuế bốn quý gần nhất so với bốn quý cùng kỳ năm trước. Nếu lợi nhuận
      của kỳ gốc là số âm, tốc độ tăng trưởng không có cách đọc nào đúng - đi từ lỗ sang
      lỗ ít hơn sẽ hiện thành một con số dương rất lớn - nên trường hợp đó được ghi là
      không công bố.
    precision: 4

  - code: related_party_receivables_to_assets
    label_vi: Phải thu bên liên quan / Tổng tài sản
    label_en: Related-party receivables to total assets
    unit: pct
    category: ownership
    formula_text: related_party_receivables / total_assets
    requires_facts: [related_party_receivables, total_assets]
    definition_vi: >-
      Tỷ trọng các khoản doanh nghiệp đang cho bên liên quan nợ trong tổng tài sản. Khoản
      mục này đáng theo dõi vì nó là nơi tiền có thể rời khỏi doanh nghiệp mà không phải
      là hoạt động kinh doanh. Tỷ trọng lớn là điều cần đối chiếu với thuyết minh về giao
      dịch với các bên liên quan trong báo cáo tài chính.
    precision: 4

  - code: shares_cagr_3y
    label_vi: Tăng trưởng số lượng cổ phiếu (3 năm)
    label_en: Share count CAGR (3y)
    unit: pct
    category: ownership
    formula_text: (shares_now / shares_3y_ago) ^ (1/3) - 1
    requires_facts: [shares_outstanding]
    definition_vi: >-
      Tốc độ tăng số lượng cổ phiếu đang lưu hành. Tăng nhanh nghĩa là phần sở hữu của
      cổ đông hiện hữu bị pha loãng — cần đối chiếu xem tiền thu được đã dùng vào việc gì.
    precision: 4

# Flag rules — the spec's "flag rules from a spec file".
#
# The content hash of this directory becomes `rule_spec_version`. Change a threshold here
# and every derived row carrying the old version is marked stale, which is the mechanism
# for "change a rule at ticker 80 and regenerate all 80".
#
# `on_missing` is the honesty dial. `unknown` means a rule whose inputs are absent reports
# "không tìm thấy công bố tương ứng" rather than silently reading as clean.
#
# Rules whose required metrics come from financial statements will sit at `unknown` until
# Arc B lands. That is correct and visible, not a gap to paper over.

spec_id: quantumedge.flags
min_benchmark_sample: 3

flags:
  # ---------- live now: price and liquidity only ----------
  - code: price_below_par_value
    name_vi: Giá dưới mệnh giá
    name_en: Trading below par value
    category: valuation
    severity: watch
    rule_kind: metric_threshold
    rule_version: v1
    requires_metrics: [price_to_par]
    on_missing: unknown
    expr: { metric: price_to_par, op: "<", value: 1.0 }
    explanation_vi: >-
      Thị trường đang trả cho mỗi cổ phiếu ít hơn mệnh giá ghi trên sổ sách. Điều này
      không tự động là xấu, nhưng nó đặt ra một câu hỏi cần câu trả lời: vì sao?

  - code: thin_liquidity_turnover_below_1bn
    name_vi: Thanh khoản mỏng - giá trị giao dịch dưới {threshold}/phiên
    name_en: Thin liquidity - turnover below {threshold} VND per session
    category: liquidity
    severity: high
    rule_kind: metric_threshold
    rule_version: v1
    requires_metrics: [avg_turnover_20s_vnd]
    on_missing: unknown
    expr: { metric: avg_turnover_20s_vnd, op: "<", value: 1000000000 }
    explanation_vi: >-
      Giá trị giao dịch bình quân dưới {threshold_vnd} mỗi phiên. Với mức này, một vị thế vài
      trăm triệu đồng có thể cần nhiều phiên để thoát, và việc bán ra có thể tự đẩy giá
      xuống.

  - code: zero_trade_sessions_over_5pct_3m
    name_vi: Nhiều phiên không có giao dịch
    name_en: Frequent zero-trade sessions
    category: liquidity
    severity: high
    rule_kind: metric_threshold
    rule_version: v1
    requires_metrics: [zero_trade_ratio_3m]
    on_missing: unknown
    expr: { metric: zero_trade_ratio_3m, op: ">", value: 0.05 }
    explanation_vi: >-
      Hơn {threshold_pct} số phiên trong ba tháng qua không có một cổ phiếu nào được khớp. Khi cần
      bán, có thể không có người mua ở bất kỳ giá nào.

  - code: price_near_52w_low
    # "52 tuần" is the window of the METRIC (pct_from_52w_high), not a rule threshold, so
    # there is nothing in expr to template it from - changing it means changing the metric,
    # which would rename this rule anyway. The 50% drawdown IS the threshold and is
    # templated as {threshold_abs}.
    prose_number_note: >-
      52 weeks is the metric's own window, owned by metrics.yaml, not this rule's threshold.
    name_vi: Giá gần đáy 52 tuần
    name_en: Price near 52-week low
    category: valuation
    severity: info
    rule_kind: metric_threshold
    rule_version: v1
    requires_metrics: [pct_from_52w_high]
    on_missing: unknown
    expr: { metric: pct_from_52w_high, op: "<", value: -0.5 }
    explanation_vi: >-
      Giá đang thấp hơn đỉnh 52 tuần trên {threshold_abs}. Đây là mô tả trạng thái giá, không phải
      nhận định rằng cổ phiếu rẻ hay đắt.

  # ---------- await Arc B: these sit at `unknown` until statements are extracted ----------
  - code: interest_coverage_below_2x
    name_vi: Khả năng trả lãi dưới {threshold} lần
    name_en: Interest coverage below {threshold}x
    category: leverage
    severity: high
    rule_kind: metric_threshold
    rule_version: v1
    requires_metrics: [interest_coverage]
    on_missing: unknown
    expr: { metric: interest_coverage, op: "<", value: 2.0 }
    explanation_vi: >-
      Lợi nhuận trước lãi vay và thuế chỉ đủ trả lãi dưới {threshold} lần. Doanh nghiệp phụ thuộc
      vào việc tiếp tục vay được để phục vụ khoản nợ hiện tại.

  - code: net_debt_ebitda_above_4x
    name_vi: Nợ ròng trên {threshold} lần EBITDA
    name_en: Net debt above {threshold}x EBITDA
    category: leverage
    severity: high
    rule_kind: metric_threshold
    rule_version: v1
    requires_metrics: [net_debt_ebitda]
    on_missing: unknown
    expr: { metric: net_debt_ebitda, op: ">", value: 4.0 }
    explanation_vi: >-
      Cần hơn bốn năm lợi nhuận để trả hết nợ ròng. Mức này khiến doanh nghiệp rất ít
      chịu được một năm kinh doanh xấu.

  - code: dilution_shares_up_25pct_3y
    # The 25% in this rule's prose is NOT the expr threshold, and must not be templated.
    # expr holds the equivalent ANNUAL CAGR (0.077); 1.077^3 = 1.25, so 25% is the
    # cumulative three-year increase a reader actually cares about. {threshold_pct} would
    # render "7,7%" and the sentence would be wrong. Checked by test_rule_prose.py.
    prose_number_note: >-
      25% is the cumulative 3-year increase; expr carries the equivalent annual CAGR.
    name_vi: Pha loãng - số cổ phiếu tăng trên 25% trong 3 năm
    name_en: Dilution - share count up over 25% in 3 years
    category: dilution
    severity: watch
    rule_kind: metric_threshold
    rule_version: v1
    requires_metrics: [shares_cagr_3y]
    on_missing: unknown
    expr: { metric: shares_cagr_3y, op: ">", value: 0.077 }
    explanation_vi: >-
      Số cổ phiếu lưu hành tăng khoảng 25% hoặc hơn trong ba năm. Phần sở hữu của cổ đông
      cũ bị pha loãng tương ứng; câu hỏi cần trả lời là tiền thu được đã dùng vào việc gì.

  - code: pe_above_2x_sector_median
    name_vi: P/E cao hơn {multiple} lần trung vị ngành
    name_en: P/E above {multiple}x sector median
    category: valuation
    severity: watch
    rule_kind: metric_vs_benchmark
    rule_version: v1
    requires_metrics: [pe]
    on_missing: unknown
    expr:
      metric: pe
      op: ">"
      benchmark: { scope: sector, window: current, stat: median }
      multiple: 2.0
    explanation_vi: >-
      Cổ phiếu đang được định giá cao gấp hơn hai lần trung vị ngành. Cần kiểm tra xem
      điều gì biện minh cho mức chênh lệch đó.

  # Relative liquidity. An absolute turnover threshold treats every sector alike, but
  # 1 tỷ/phiên is unremarkable in steel and near-dead in food/agri. These compare a stock
  # against its own peers at the same date, which is what the benchmark layer is for.
  # No new evaluator code: metric_vs_benchmark already accepts a fractional multiple.
  - code: turnover_below_quarter_of_sector_median
    name_vi: Giá trị giao dịch dưới {multiple} lần trung vị ngành
    name_en: Turnover below a quarter of the sector median
    category: liquidity
    severity: watch
    rule_kind: metric_vs_benchmark
    rule_version: v1
    requires_metrics: [avg_turnover_20s_vnd]
    on_missing: unknown
    expr:
      metric: avg_turnover_20s_vnd
      op: "<"
      benchmark: { scope: sector, window: current, stat: median }
      multiple: 0.25
    explanation_vi: >-
      Giá trị giao dịch bình quân của mã này thấp hơn {multiple} lần trung vị nhóm ngành.
      So với các mã cùng ngành, việc mua hoặc bán một lượng lớn sẽ khó hơn đáng kể.
      Đây là mô tả mức độ thanh khoản, không phải nhận định về giá.

  - code: zero_trade_ratio_above_3x_sector_median
    name_vi: Số phiên không giao dịch cao hơn {multiple} lần trung vị ngành
    name_en: Zero-trade session ratio above {multiple}x the sector median
    category: liquidity
    severity: watch
    rule_kind: metric_vs_benchmark
    rule_version: v1
    requires_metrics: [zero_trade_ratio_3m]
    on_missing: unknown
    expr:
      metric: zero_trade_ratio_3m
      op: ">"
      benchmark: { scope: sector, window: current, stat: median }
      multiple: 3.0
    explanation_vi: >-
      Tỷ lệ phiên không có giao dịch nào của mã này cao hơn {multiple} lần trung vị nhóm ngành.
      Có những phiên mà không thể bán ở bất kỳ giá nào, vì không có giao dịch diễn ra.

  # ---------- await Agent 1: no event source exists yet ----------
  - code: auditor_change_within_24m
    name_vi: Thay đổi đơn vị kiểm toán trong {within_months} tháng
    name_en: Auditor change within {within_months} months
    category: governance
    severity: high
    rule_kind: event_presence
    rule_version: v1
    on_missing: unknown
    expr: { event_type: auditor_change, within_months: 24 }
    explanation_vi: >-
      Doanh nghiệp đã thay đổi đơn vị kiểm toán trong hai năm qua. Bản thân việc này
      không phải vi phạm, nhưng nó là một trong những dấu hiệu đáng kiểm tra kỹ nhất.

  - code: no_audited_annual_statement_18m
    name_vi: Không có báo cáo kiểm toán năm trong {within_months} tháng
    name_en: No audited annual statement in {within_months} months
    category: disclosure
    severity: high
    rule_kind: data_absence
    rule_version: v1
    on_missing: unknown
    expr:
      absent: financial_period
      period_type: Y
      is_audited: true
      within_months: 18
    explanation_vi: >-
      Không tìm thấy báo cáo tài chính năm đã được kiểm toán trong {within_months} tháng gần nhất.
      Việc chậm công bố là chỉ dấu rủi ro quản trị rõ ràng nhất mà nhà đầu tư nhỏ có thể
      tự kiểm tra.
